server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/docdrift?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.gemini.api-key=${GEMINI_API_KEY:${GEMINI_AUTH_KEY:}}
app.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
app.repo.max-files=5000
